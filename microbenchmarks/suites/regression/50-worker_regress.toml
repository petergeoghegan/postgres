# Cold-run scan over a heap whose order jitters within a ~21-page band around
# index order (originally thought to be an io_method=worker specific issue,
# but not actually io_method dependent at all).
# DESC index on semi-random data with fillfactor=90.
#
# WR1 and WR2 are the SAME cold, scattered index scan in OPPOSITE directions.
# The whole ~84k-page range is read from disk (uncached: shared buffers evicted,
# OS cache dropped). The heap is laid out by "ORDER BY i + 1024*(random()-0.5)"
# (see the data load below): sorted on the key but with a +/-512-key local
# shuffle (2 rows/key, ~96 rows/page -> ~+/-10 heap pages), so the heap-block
# sequence the scan feeds the read stream is monotonic-on-average but jitters
# within a ~21-page band. A page's ~96 rows are smeared over ~1024 key
# positions, so the callback returns each block ~45 times, non-consecutively,
# with up to ~21 distinct blocks queued between two visits.
#   WR1: ORDER BY a DESC -> EXPLAIN "Index Scan" (forward), ASCENDING heap blocks.
#   WR2: ORDER BY a ASC  -> EXPLAIN "Index Scan Backward", DESCENDING heap blocks.
#
# What the pair stresses (as of 2026-09-10, with read stream request
# deduplication, READ_STREAM_DEDUP_RECENT):
#   * The dedup ring (READ_STREAM_DEDUP_RECENT: the 32 most recently queued
#     block numbers). Every non-consecutive revisit of a block is a repeat entry
#     -- no pin, no I/O, no look-ahead distance -- that is pinned afresh by a
#     buffer-mapping hit when its turn comes. The ~21-block repeat reach is what
#     sizes the ring: a 16-entry ring measured too small here (2026-09-07, WR1
#     1489 ms with 16 entries vs 1146 ms with 32).
#   * I/O combining across repeats (WR1 only): repeats do not break the pending
#     read, so the ascending first-visit order combines into ~4.5-block reads
#     (EXPLAIN I/O: count=18932 size=4.46 for 84367 blocks). WR2's descending
#     order cannot combine (size=1.07, count ~= read).
#   * A baseline that is cheap in one direction only: OS page-cache and NVMe
#     forward read-ahead speed master's ascending WR1; descending WR2 gets
#     neither and reads serially.
#
# Measured 2026-09-10 (scratch cluster, io_uring, eic=100, io_combine_limit=16,
# uncached, min of 3, patch/master):
#   WR1 0.81x (1065 vs 1318 ms); WR2 0.18x (1204 vs 6534 ms).
#   io_method=worker (io_max_workers=32): WR1 0.82x, WR2 0.19x.
#   debug_io_direct=data: WR1 0.47x (master 2400 ms without OS read-ahead),
#   WR2 0.21x.
#   io_combine_limit=1: WR1 0.95x -- WR1's win is the combining that dedup
#   enables. io_combine_limit=32/128 add nothing (size 4.89/4.99): the length of
#   the ascending runs bounds the reads, not the limit.
#   Look-ahead distance stays at ~40 buffers (avg 39.5 of capacity 1616), since
#   repeats no longer consume distance.
#
# ---------------------------------------------------------------------------
# History: why the pair exists. Figures and analysis below were measured
# 2026-06-27 on branch index-prefetch-v0.83, BEFORE request deduplication.
# WR1 was then a ~1.29x REGRESSION and WR2 a ~3.7x win; the pair isolated why.
#
# Two consequences of the shuffle, identical in both directions:
#   * No I/O combining: the stream only fused strictly-ascending contiguous
#     blocks and a repeat broke the pending read, so every I/O was 1 block
#     (size=1.00).
#   * In-flight re-requests: each repeat of a page whose single read was still
#     outstanding took the BUFFER_IO_IN_PROGRESS / foreign_io path in
#     AsyncReadBuffers(): it bumped the stream's I/O "count" but issued no pread.
#     So "count" >> "read" (~84k distinct pages = 8.1M rows/96) -- a fingerprint
#     of the scatter, not a cost. (With dedup the fingerprint is inverted:
#     count*size ~= read.)
#
# The PATCH cost was the same and DIRECTION-AGNOSTIC: deep look-ahead pinned
# "distance" buffers at once (~423 at eic=100, since every repeat held a pin);
# past REFCOUNT_ARRAY_ENTRIES (=8) pins, the per-backend fast pin array spills
# to PrivateRefCountHash, so every pin/unpin hit the slow hash + ResourceOwner
# path (perf: ResourceOwnerForget, Reserve/GetPrivateRefCountEntrySlow). That
# CPU scaled with pins-held = distance = eic x scatter (distance/in-progress
# ~4-10), so it turned on once distance crossed ~8 (eic=1 -> distance ~1,
# ~free; eic>=4 -> distance >8 -> it appeared), reaching ~+500ms at eic=100.
# NOT read-stream logic, NOT extra I/O.
#
# What FLIPPED the outcome was the BASELINE's read cost, set by two stacked,
# FORWARD-ONLY read-ahead layers that speed the ascending scan and do nothing
# for the descending one (master serial reads, us/read):
#                          ascending (WR1)    descending (WR2)
#     buffered              3.3 (cache hit)    138
#     direct (O_DIRECT)     92                 136
#   - OS page-cache readahead: ascending buffered 3.3 vs direct 92 us = ~28x
#     (ascending+buffered only; dominant -- this is what made WR1's baseline fast).
#   - SSD/NVMe controller read-ahead: even under O_DIRECT, ascending 92 vs
#     descending 136 us = ~1.47x (the drive prefetches an ascending LBA stream).
#     A standalone O_DIRECT QD1 read of a plain file confirmed it's device-level:
#     pure-sequential ascending 21 us vs descending 134 us = ~6.5x, but the
#     scan's +/-10 page jitter defeats most of the drive prefetch, leaving the
#     ~1.3-1.5x.
#   - Descending (WR2) got neither: buffered ~= direct (~11.5s, ~138 us/read).
#
# So WR1 (forward/ascending): the baseline's reads were ~free (OS+SSD
# read-ahead), the patch's io_uring prefetch won nothing on I/O and only its
# pin-overflow showed -> ~1.29x REGRESSION. WR2 (backward/descending): the
# baseline did slow serial random reads (~11.7s), the patch's 100-deep prefetch
# parallelized them (~1.9s) and that ~10s win dwarfed the same ~0.5s pin cost ->
# ~0.27x (3.7x FASTER). Causal proof: running WR1 with --direct removed OS
# readahead, collapsed its baseline to ~8.8s, and flipped WR1 to a WIN (~0.27x)
# like WR2 -- but NOT identical in absolute terms: ascending kept the SSD's
# residual read-ahead, so WR1-direct stayed ~30% faster than WR2 (8.8s vs 12.5s
# baseline); the ratios coincided only because the patch's ~3.7x parallel
# speedup applied to both. (The baseline side of this still holds: 2026-09-10
# master WR1 is 1318 ms buffered vs 2400 ms direct.)
#
# (Dropped: a parallel "readstream" suite (RS1/RS2, from
# tomas-weird-issue-readstream.sql) was removed as largely redundant with these.
# It showed the identical forward-regresses / backward-wins pattern and the same
# size=1.00, count>>read pin-overflow signature -- just a bigger, sparser
# fillfactor=20 table (~5x the pages). WR1/WR2 exercise the same mechanism more
# sharply (deeper look-ahead distance) and ~20x faster, so RS added cost without
# distinct coverage.)
# ---------------------------------------------------------------------------
#
# Family note: tupdistance (suite 20) is this SAME mechanism at the OPPOSITE,
# perfectly-clustered extreme (0 scatter, 4 dups, repeats 1-2 blocks back) --
# opposites but fundamentally similar. Before dedup both were
# io_combine_limit-INSENSITIVE: the cost was foreign-re-request pin churn
# (count>>read), intrinsic to the scatter/dups. Since dedup both are
# io_combine_limit-SENSITIVE in the other direction: the ring absorbs the
# repeats, the pending read grows past them, and the ascending members (WR1,
# TD2) are measured by how far the read combines (WR1 size 4.46, bounded by
# run length; TD2 size 16.00 = the limit). munro (suite 40) is the GENUINELY
# different one -- its extreme scatter (~680-page window) EXCEEDS both the
# 32-entry dedup ring and the look-ahead window, so it has ~no dedup and ~no
# churn (count ~= read, size ~1.08); it measures look-ahead DEPTH itself, which
# io_combine_limit governs (icl=1 keeps the distance at ~5, icl=16 lets it
# ramp to ~330-510).

[suite]
mode_prefix = "worker_regress"
order = 50
cli_flag = "--worker-regress-feb"
cli_dest = "worker_regress_feb_tests"
help = "Run worker_regress benchmark (cold scan over a heap jittered within a ~21-page band; historically an io_method=worker regression)"
title = "Worker Regression Benchmark"
tables = [
    "worker_regress",
]
setup_sql_file = "50-worker_regress.sql"
row_description = "5M rows"

[queries.WR1]
name = "Forward scan, ascending heap blocks jittered within a ~21-page band: stresses the dedup ring and I/O combining across repeats, against a baseline sped by OS+SSD forward read-ahead"
sql = """

            SELECT * FROM (SELECT a FROM worker_regress
            WHERE a BETWEEN -4054398 AND -5823
            ORDER BY a DESC offset 1000000000)
        """
evict = [
    "worker_regress",
]
prewarm_indexes = [
    "idx_worker_regress",
]
prewarm_tables = [
    "worker_regress",
]

[queries.WR1.gucs]
enable_bitmapscan = "off"
enable_seqscan = "off"
enable_indexonlyscan = "off"

[queries.WR2]
name = "Backward scan, descending heap blocks jittered within a ~21-page band: stresses the dedup ring with eic-bound single-block reads (no combining possible), against a serial-read baseline"
sql = """

            SELECT * FROM (SELECT a FROM worker_regress
            WHERE a BETWEEN -4054398 AND -5823
            ORDER BY a ASC offset 1000000000)
        """
evict = [
    "worker_regress",
]
prewarm_indexes = [
    "idx_worker_regress",
]
prewarm_tables = [
    "worker_regress",
]

[queries.WR2.gucs]
enable_bitmapscan = "off"
enable_seqscan = "off"
enable_indexonlyscan = "off"
